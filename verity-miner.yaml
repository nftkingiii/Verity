version: "1"
kind: miner
id: 9001 # Confirm availability in the integration dashboard before registration.
slug: verity-onchain-lookup
protocol: generic
name: Verity On-Chain Transaction Lookup
description: Archive-capable EVM transaction lookup with RPC fallback, value, execution status, method selector, fees, and evidence.
base_url: https://verity-production-fcf5.up.railway.app

rate_limit_per_sec: 8
cache_ttl_sec: 0
circuit_threshold: 3
circuit_cooldown_seconds: 20

endpoints:
  - path: /lookup
    external_path: /v1/lookup
    method: GET
    description: Look up a transaction on a supported EVM chain.
    param_map:
      chain: chain
      tx_hash: tx_hash
      hash: tx_hash
      txHash: tx_hash
      query: query
      question: question

input_schema:
  type: object
  anyOf:
    - required: [tx_hash]
    - required: [hash]
    - required: [txHash]
    - required: [query]
    - required: [question]
  properties:
    chain:
      type: string
      enum: [ethereum, base, arbitrum, optimism, polygon]
    tx_hash:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
    hash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
    txHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
    query: { type: string, minLength: 66, maxLength: 240 }
    question: { type: string, minLength: 66, maxLength: 240 }

output_schema:
  type: object
  required: [chain, chain_id, tx_hash, status, confidence, answer, canonical, summary]
  properties:
    chain: { type: string }
    chain_id: { type: integer }
    tx_hash: { type: string }
    status: { type: string }
    block_number: { type: [string, "null"] }
    from: { type: string }
    to: { type: string }
    value_wei: { type: string }
    value_eth: { type: [string, "null"] }
    method_selector: { type: [string, "null"] }
    transaction_type: { type: string }
    gas_used: { type: [string, "null"] }
    transaction_fee_wei: { type: [string, "null"] }
    transaction_fee_eth: { type: [string, "null"] }
    answer: { type: string }
    confidence: { type: number, minimum: 0, maximum: 1 }
    canonical: { type: string }
    summary: { type: string }

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: answer
    reason_field: summary
  supported_intents:
    - ONCHAIN_TX_LOOKUP

limitations:
  - code: MAX_PARAM_VALUE
    message: tx_hash accepts exactly one 32-byte EVM transaction hash.
    param: tx_hash
    property: length
    value_num: 66
    operator: eq

docs:
  repository: https://github.com/nftkingiii/Verity

on_chain:
  description: >-
    The transaction's execution status and value, in the shape a contract can
    settle on.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: status
        description: Execution status of the transaction.
        source_path: status
      - index: 1
        name: answer
        description: One-line answer to the question that was asked.
        source_path: answer
    integers:
      - index: 0
        name: block_number
        description: Block the transaction was included in.
        source_path: block_number
      - index: 1
        name: gas_used
        description: Gas units consumed.
        source_path: gas_used
      - index: 2
        name: confidence_x10000
        description: Confidence from 0 to 1, multiplied by 10000.
        source_path: confidence
        multiplier: 10000
  request:
    - endpoint: lookup
      method: GET
      query_params:
        tx_hash: { source: strings.0 }
        chain:   { source: strings.1 }
