version: "1"
kind: miner
id: 9003 # Confirm availability in the integration dashboard before registration.
slug: verity-weather-forecast
protocol: generic
name: Verity Weather Forecast
description: Location-aware daily and hourly weather forecast with temperatures, dew point, precipitation, conditions, wind, timestamps, and coverage metadata.
base_url: https://verity-production-fcf5.up.railway.app

rate_limit_per_sec: 4
cache_ttl_sec: 0
circuit_threshold: 3
circuit_cooldown_seconds: 20

endpoints:
  - path: /forecast
    external_path: /v1/forecast
    method: GET
    description: Read one to seven days of daily and hourly forecasts for coordinates or a place name.
    param_map:
      latitude: latitude
      longitude: longitude
      forecast_days: forecast_days
      days: forecast_days
      location: location
      q: location
      query: location

input_schema:
  type: object
  anyOf:
    - required: [latitude, longitude]
    - required: [location]
    - required: [q]
    - required: [query]
  properties:
    latitude: { type: number, minimum: -90, maximum: 90 }
    longitude: { type: number, minimum: -180, maximum: 180 }
    location: { type: string, minLength: 1, maxLength: 100 }
    q: { type: string, minLength: 1, maxLength: 100 }
    query: { type: string, minLength: 1, maxLength: 100 }
    forecast_days: { type: integer, minimum: 1, maximum: 7 }
    days: { type: integer, minimum: 1, maximum: 7 }

output_schema:
  type: object
  required: [latitude, longitude, forecast_days, timezone, days, hourly, coverage, confidence, answer, canonical, summary]
  properties:
    latitude: { type: string }
    longitude: { type: string }
    forecast_days: { type: number }
    days:
      type: array
      items:
        type: object
        required: [date, weather_code, temperature_max_c, temperature_min_c, precipitation_probability_max_percent, wind_speed_max_kmh]
        properties:
          date: { type: string }
          weather_code: { type: number }
          temperature_max_c: { type: number }
          temperature_min_c: { type: number }
          precipitation_probability_max_percent: { type: number }
          wind_speed_max_kmh: { type: number }
    hourly:
      type: array
      items:
        type: object
        required: [time, temperature_c, dew_point_c, precipitation_probability_percent, precipitation_mm, condition, wind_speed_kmh]
    coverage: { type: object }
    timezone: { type: string }
    confidence: { type: number, minimum: 0, maximum: 1 }
    answer: { type: string }
    canonical: { type: string }
    summary: { type: string }

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: answer
    reason_field: summary
  supported_intents:
    - WEATHER_FORECAST

docs:
  repository: https://github.com/nftkingiii/Verity
