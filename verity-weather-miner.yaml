version: "1"
kind: miner
id: 9006 # Verified unused in the active integration catalog on 2026-08-24.
slug: verity-current-weather
protocol: generic
name: Verity Current Weather Check
description: Current weather for coordinates or a place name, with normalized temperatures, condition, humidity, dew point, pressure, precipitation, and wind.
base_url: https://verity-production-fcf5.up.railway.app

rate_limit_per_sec: 4
cache_ttl_sec: 0
circuit_threshold: 3
circuit_cooldown_seconds: 20

endpoints:
  - path: /weather
    external_path: /v1/weather
    method: GET
    description: Read current weather conditions at a supplied latitude and longitude.
    param_map:
      latitude: latitude
      longitude: longitude
      location: location
      q: location
      query: location
      question: question

input_schema:
  type: object
  anyOf:
    - required: [latitude, longitude]
    - required: [location]
    - required: [q]
    - required: [query]
    - required: [question]
  properties:
    latitude: { type: number, minimum: -90, maximum: 90 }
    longitude: { type: number, minimum: -180, maximum: 180 }
    location: { type: string, minLength: 1, maxLength: 100 }
    q: { type: string, minLength: 1, maxLength: 100 }
    query: { type: string, minLength: 1, maxLength: 100 }
    question: { type: string, minLength: 1, maxLength: 200 }

output_schema:
  type: object
  required: [latitude, longitude, observed_at, temperature_c, temperature_f, condition, relative_humidity_percent, dew_point_c, pressure_hpa, precipitation_mm, wind_speed_kmh, confidence, answer, canonical, summary]
  properties:
    latitude: { type: string }
    longitude: { type: string }
    observed_at: { type: string }
    temperature_c: { type: number }
    temperature_f: { type: number }
    condition: { type: string }
    relative_humidity_percent: { type: number }
    apparent_temperature_c: { type: number }
    dew_point_c: { type: number }
    pressure_hpa: { type: number }
    precipitation_mm: { type: number }
    weather_code: { type: number }
    wind_speed_kmh: { type: number }
    confidence: { type: number, minimum: 0, maximum: 1 }
    answer: { type: string }
    canonical: { type: string }
    summary: { type: string }

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: answer
    reason_field: summary
  supported_intents:
    - WEATHER_CHECK

docs:
  repository: https://github.com/nftkingiii/Verity
